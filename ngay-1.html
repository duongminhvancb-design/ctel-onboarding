<style>
:root{
  --brand:#1C9AD6; --brand-soft:#72BCDF; --chrome:#1A1A1A; --chrome-ink:#FFFFFF; --chrome-mute:#B5B5B5;
  --bg:#FFFFFF; --panel:#EEEEEE; --head:#414141; --ink:#666666; --line:#DCDCDC; --bad:#B42318; --bad-bg:#FDECEA;
  --font:"Montserrat", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#141414;--panel:#222222;--head:#EDEDED;--ink:#BDBDBD;--line:#353535;--bad:#FF8A80;--bad-bg:#3A1A18;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#141414;--panel:#222222;--head:#EDEDED;--ink:#BDBDBD;--line:#353535;--bad:#FF8A80;--bad-bg:#3A1A18;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));position:relative;overflow-x:hidden}
.art{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;opacity:.5}
.card{position:relative;width:100%;max-width:420px;background:var(--bg);border-radius:12px;padding:28px 26px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.eyebrow{align-self:flex-start;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);border:1px solid var(--brand-soft);border-radius:999px;padding:3px 11px}
h1{margin:0;color:var(--head);font-size:22px;line-height:1.3}
h1 span{color:var(--brand)}
p{margin:0}
label{font-size:13px;font-weight:600;color:var(--head);display:flex;flex-direction:column;gap:6px}
.pw{display:flex;gap:8px}
input{flex:1;min-width:0;font:500 15px var(--font);color:var(--head);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px}
input:focus{outline:3px solid var(--brand-soft);outline-offset:1px;border-color:var(--brand)}
.toggle{flex:none;font:600 12.5px var(--font);color:var(--brand);background:none;border:1.5px solid var(--line);border-radius:8px;padding:0 12px;cursor:pointer}
.btn{font:700 15px var(--font);color:#FFFFFF;background:var(--brand);border:none;border-radius:8px;padding:11px 16px;cursor:pointer}
.btn:hover{background:#1582B5}
.btn:disabled{opacity:.6;cursor:wait}
button:focus-visible{outline:3px solid var(--brand-soft);outline-offset:2px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:8px 12px;font-size:13.5px}
.note{font-size:12.5px;border-top:1px solid var(--line);padding-top:12px}
</style>

  <span class="eyebrow">CMC Telecom · Onboarding Ngày 1</span>
  <h1>Mô hình tổ chức &amp; <span>Sản phẩm dịch vụ</span> CMC Telecom</h1>
  <p>Tài liệu nội bộ đã được mã hóa. Nhập mật khẩu để mở.</p>
  <label for="pw">Mật khẩu

  <button type="submit" class="btn" id="go">Mở tài liệu</button>
  <p class="note">Mã hóa AES-256-GCM, khóa sinh từ mật khẩu bằng PBKDF2-SHA256. Nội dung chỉ được giải mã ngay trên trình duyệt của bạn.</p>
